
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123c2b">
  <title>Quran Ziya 365</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f5ed;
      color: #183b2d;
      text-align: center;
    }
    header {
      background: #123c2b;
      color: white;
      padding: 30px 15px;
    }
    h1 { margin: 0; font-size: 28px; }
    .arabic { font-size: 30px; margin-top: 15px; }
    main { padding: 20px; }
    .card {
      background: white;
      padding: 20px;
      margin: 15px auto;
      max-width: 420px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000012;
    }
    button {
      background: #176443;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 13px 20px;
      margin: 6px;
      font-size: 16px;
    }
    select {
      padding: 12px;
      border-radius: 8px;
      width: 90%;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <header>
    <h1>QURAN ZIYA 365</h1>
    <div class="arabic">القرآن ضياء</div>
    <p>कुरआन की रोशनी, हर भाषा में</p>
  </header>
  <main>
    <div class="card">
      <h2>अस्सलामु अलैकुम</h2>
      <p>कुरआन पढ़ें, समझें और सुनें।</p>
    </div>
    <div class="card">
      <h3>अपनी भाषा चुनें</h3>
      <select>
        <option>हिंदी</option>
        <option>English</option>
        <option>اردو</option>
        <option>বাংলা</option>
        <option>தமிழ்</option>
        <option>తెలుగు</option>
        <option>मराठी</option>
      </select>
    </div>
    <div class="card">
      <h3>कुरआन शरीफ</h3>
      <p>114 सूरह पढ़ने और समझने का आपका स्थान।</p>
      <button onclick="alert('कुरआन पढ़ने की सुविधा अगले चरण में जोड़ी जाएगी।')">कुरआन पढ़ें</button>
      <button onclick="alert('ऑडियो सुविधा अगले चरण में जोड़ी जाएगी।')">कुरआन सुनें</button>
    </div>
    <p>Quran Ziya 365 — सभी के लिए मुफ्त</p>
  </main>
</body>
</html>
